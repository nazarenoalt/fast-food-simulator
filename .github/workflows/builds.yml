# Arma el juego listo para jugar (Windows, Linux y macOS).
# - En cada push a main: deja los .zip como "artifacts" de la corrida.
# - Si el número del archivo VERSION todavía no tiene Release, la publica (con etiqueta vX.Y.Z).
#   Para sacar una versión nueva alcanza con cambiar VERSION.
name: Builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7-stable"

jobs:
  exportar:
    name: Exportar juego
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/modelos-lfs # TASK-0003: solo los .glb del juego, con caché
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Compiladores cruzados (MinGW para Windows, zig para macOS)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64
          pip install ziglang
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Compilar librerías (Linux, Windows y macOS universal)
        working-directory: rust
        run: |
          cargo build --release -p carrito_game
          cargo build --release -p carrito_game --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/carrito_game.dll target/release/
          cargo zigbuild --release -p carrito_game --target universal2-apple-darwin
          cp target/universal2-apple-darwin/release/libcarrito_game.dylib target/release/
          # El editor de Godot que exporta carga la versión "debug": le damos la misma librería.
          mkdir -p target/debug && cp target/release/libcarrito_game.so target/debug/
      - name: Plantillas de exportación (caché)
        id: cache-plantillas
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-plantillas-${{ env.GODOT_VERSION }}
      - name: Descargar plantillas
        if: steps.cache-plantillas.outputs.cache-hit != 'true'
        run: |
          D=~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p "$D"
          curl -sSL -o t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q -j t.tpz templates/version.txt templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe \
            templates/macos.zip -d "$D"
          rm t.tpz
      - name: Descargar Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot-bin

      - name: Exportar
        run: |
          mkdir -p build/windows build/linux build/macos
          ./godot-bin --headless --path godot --import || true
          ./godot-bin --headless --path godot --export-release "Windows" ../build/windows/FastFoodSimulator.exe
          ./godot-bin --headless --path godot --export-release "Linux" ../build/linux/FastFoodSimulator.x86_64
          ./godot-bin --headless --path godot --export-release "macOS" ../build/macos/FastFoodSimulator.zip
          test -f build/windows/FastFoodSimulator.exe && test -f build/linux/FastFoodSimulator.x86_64 && test -f build/macos/FastFoodSimulator.zip

      - name: Probar el juego exportado (Linux, sin pantalla)
        run: |
          cd build/linux
          ./FastFoodSimulator.x86_64 --headless --quit-after 300 2>&1 | tee salida.txt
          ! grep -E "ERROR|Error en los datos" salida.txt

      - name: Empaquetar
        run: |
          mkdir -p dist
          (cd build/windows && zip -q -r ../../dist/FastFoodSimulator-windows.zip .)
          (cd build/linux && rm -f salida.txt && chmod +x FastFoodSimulator.x86_64 && zip -q -r ../../dist/FastFoodSimulator-linux.zip .)
          cp build/macos/FastFoodSimulator.zip dist/FastFoodSimulator-macos.zip
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: FastFoodSimulator-windows
          path: dist/FastFoodSimulator-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FastFoodSimulator-linux
          path: dist/FastFoodSimulator-linux.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FastFoodSimulator-macos
          path: dist/FastFoodSimulator-macos.zip

      - name: ¿Hay que publicar esta versión?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          if gh release view "$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar Release
        if: github.ref == 'refs/heads/main' && steps.version.outputs.publicar == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          make_latest: true
          files: dist/*.zip
          body: |
            ## Cómo jugar
            Bajá el .zip de tu sistema, descomprimilo y abrí el juego.

            - **Windows:** `FastFoodSimulator.exe`. Si aparece "Windows protegió tu PC", tocá *Más información → Ejecutar de todas formas* (el juego no está firmado).
            - **macOS:** abrí `Fast Food Simulator.app` con clic derecho → *Abrir* la primera vez (no está firmado por Apple).
            - **Linux:** `./FastFoodSimulator.x86_64`.

            Controles y cómo atender a un cliente: ver el README del repositorio.

  probar-windows:
    name: Probar el .exe en Windows
    needs: exportar
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FastFoodSimulator-windows
      - name: Abrir el juego sin pantalla
        shell: bash
        run: |
          unzip -q FastFoodSimulator-windows.zip -d juego
          cd juego
          ./FastFoodSimulator.exe --headless --quit-after 300 > salida.txt 2>&1 || true
          cat salida.txt
          grep -q "Initialize godot-rust" salida.txt
          ! grep -E "ERROR|Error en los datos" salida.txt
