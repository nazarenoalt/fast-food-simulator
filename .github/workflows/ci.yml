# Verifica las specs en cada push: tests de reglas, trazabilidad y prueba de humo en Godot.
name: CI
on: [push, pull_request]

jobs:
  specs:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7-stable"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Tests de reglas y trazabilidad
        working-directory: rust
        run: cargo test
      - name: Descargar Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot-bin
      - name: Prueba de humo
        run: GODOT="$PWD/godot-bin" tools/prueba_humo.sh
