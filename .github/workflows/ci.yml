# En cada PR solo revisa las convenciones (rama, título, descripción). La verificación
# completa (formato, lints, tests, trazabilidad, docs y prueba de humo) la corre en local el
# dueño de la feature con tools/verificar.sh y pega el resultado en el PR (SPEC-000).
# El trabajo "specs" queda para correrlo a mano desde la pestaña Actions si hace falta.
name: CI
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convenciones:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Rama, título y descripción del PR (formato en CLAUDE.md)
        env:
          TITULO: ${{ github.event.pull_request.title }}
          RAMA: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          CUERPO: ${{ github.event.pull_request.body }}
        run: |
          tipos='feat|fix|docs|refactor|test|chore|ci|perf'
          error=0
          fallar() { echo "::error::$1"; error=1; }
          [ "$BASE" = "main" ] || fallar "El PR tiene que apuntar a main (apunta a $BASE)."
          [[ "$RAMA" =~ ^($tipos)/TASK-([0-9]{4})-[a-z0-9]+(-[a-z0-9]+)*$ ]] \
            || fallar "Rama '$RAMA': usar tipo/TASK-0000-slug-en-minusculas."
          tarea="${BASH_REMATCH[2]}"
          [[ "$TITULO" =~ ^($tipos)\ \([a-z0-9-]+\):\ .{3,}$ ]] \
            || fallar "Título '$TITULO': usar 'tipo (modulo): descripción'."
          [ -z "$tarea" ] || grep -q "TASK-$tarea" <<<"$CUERPO" \
            || fallar "La descripción debe mencionar TASK-$tarea (ver plantilla)."
          grep -q "VERIFICACIÓN: todo OK" <<<"$CUERPO" \
            || fallar "Falta pegar en la descripción la última línea de tools/verificar.sh."
          exit $error

  specs:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7-stable"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/modelos-lfs # TASK-0003: solo los .glb del juego, con caché
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Formato
        working-directory: rust
        run: cargo fmt --check
      - name: Lints (sin advertencias, TASK-0002)
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests de reglas, trazabilidad y docs
        working-directory: rust
        run: cargo test
      - name: Descargar Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot-bin
      - name: Prueba de humo
        run: GODOT="$PWD/godot-bin" tools/prueba_humo.sh
